<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login — EmailGuard AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="css/custom.css"/>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center px-4">

<div class="w-full max-w-md">

    <!-- Logo -->
    <div class="text-center mb-8">
        <a href="index.html" class="inline-flex items-center gap-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl">E</div>
            <span class="text-2xl font-bold text-white">EmailGuard <span class="text-indigo-400">AI</span></span>
        </a>
        <p class="text-slate-400 mt-3 text-sm">Sign in to your account</p>
    </div>

    <!-- Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8">

        <!-- Error message -->
        <div id="error-msg" class="hidden mb-4 p-3 bg-red-500/20 border border-red-500/50 rounded-lg text-red-400 text-sm"></div>

        <!-- Form -->
        <form id="login-form" class="space-y-5">

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1.5">Email address</label>
                <input
                    id="email"
                    type="email"
                    required
                    placeholder="you@example.com"
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition text-sm"
                />
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-300 mb-1.5">Password</label>
                <div class="relative">
                    <input
                        id="password"
                        type="password"
                        required
                        placeholder="••••••••"
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition text-sm pr-12"
                    />
                    <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-sm">👁</button>
                </div>
            </div>

            <button
                type="submit"
                id="submit-btn"
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl transition text-sm"
            >
                Sign In
            </button>
        </form>

        <!-- Divider -->
        <div class="flex items-center gap-3 my-6">
            <div class="flex-1 h-px bg-slate-800"></div>
            <span class="text-slate-600 text-xs">OR</span>
            <div class="flex-1 h-px bg-slate-800"></div>
        </div>

        <!-- Signup link -->
        <!-- Signup link -->
        <p class="text-center text-sm text-slate-400">
            Don't have an account?
            <a href="signup.html" class="text-indigo-400 hover:text-indigo-300 font-medium transition">Sign up free</a>
        </p>

        <!-- Divider -->
        <div class="flex items-center gap-3 my-4">
            <div class="flex-1 h-px bg-slate-800"></div>
            <span class="text-slate-600 text-xs">OTHER PORTALS</span>
            <div class="flex-1 h-px bg-slate-800"></div>
        </div>

        <!-- Portal links -->
        <div class="flex flex-col gap-2">
            <a href="org-login.html"
            class="w-full text-center border border-slate-700 hover:border-cyan-500 text-slate-400 hover:text-cyan-400 py-2.5 rounded-xl text-sm transition">
                🏢 Organisation Login
            </a>
            <a href="admin-login.html"
            class="w-full text-center border border-slate-700 hover:border-red-500 text-slate-400 hover:text-red-400 py-2.5 rounded-xl text-sm transition">
                ⚡ Admin Access
            </a>
        </div>

    <!-- Back to home -->
    <p class="text-center mt-6 text-sm text-slate-600">
        <a href="index.html" class="hover:text-slate-400 transition">← Back to home</a>
    </p>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script>
    // Redirect if already logged in
    if (Auth.isLoggedIn()) {
        window.location.href = "analyze.html";
    }

    function togglePassword() {
        const input = document.getElementById("password");
        input.type = input.type === "password" ? "text" : "password";
    }

    function showError(msg) {
        const el = document.getElementById("error-msg");
        el.textContent = msg;
        el.classList.remove("hidden");
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn   = document.getElementById("submit-btn");
        const email = document.getElementById("email").value.trim();
        const pass  = document.getElementById("password").value;

        btn.textContent = "Signing in...";
        btn.disabled    = true;

        try {
            await Auth.login(email, pass);
            window.location.href = "analyze.html";
        } catch (err) {
            showError(err.message || "Login failed. Please check your credentials.");
            btn.textContent = "Sign In";
            btn.disabled    = false;
        }
    });
</script>
</body>
</html>
